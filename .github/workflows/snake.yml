name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#1f6feb&color_dots=#ebedf0,#a3f7bf,#7ee787,#3fb965,#1a7f37
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#79c0ff&color_dots=#151b23,#0f3d24,#1a6b3c,#3fb965,#7ee787

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
